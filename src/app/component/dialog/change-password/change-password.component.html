<mat-toolbar color="primary">
    <mat-toolbar-row fxLayout="row">
        <span class="title-center"> Cambiar Contraseña</span>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content>
    <form [formGroup]="changePasswordForm">
        <div fxFlex fxLayout="column">

            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Contraseña antigua</mat-label>
                <input #verClave1 matInput formControlName="oldPassword" type="password" required>
                <button mat-icon-button matSuffix type="button" tabindex="-1" (click)="verClave1.type = verClave1.type === 'password' ? 'text' : 'password'" [matTooltip]="verClave1.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'"><mat-icon>{{ verClave1.type === 'password' ? 'visibility' : 'visibility_off' }}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls.oldPassword.touched && changePasswordForm.controls.oldPassword.invalid">
                    <span *ngIf="changePasswordForm.controls.oldPassword.error.required">Este campo es
                        obligatorio</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Nueva Contraseña</mat-label>
                <input #verClave2 matInput formControlName="newPassword" type="password" required>
                <button mat-icon-button matSuffix type="button" tabindex="-1" (click)="verClave2.type = verClave2.type === 'password' ? 'text' : 'password'" [matTooltip]="verClave2.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'"><mat-icon>{{ verClave2.type === 'password' ? 'visibility' : 'visibility_off' }}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls.newPassword.touched && changePasswordForm.controls.newPassword.invalid">
                    <span *ngIf="changePasswordForm.controls.newPassword.error.required">Este campo es
                        obligatorio</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Confirmar Contraseña</mat-label>
                <input #verClave3 matInput formControlName="confirmPassword" type="password" required>
                <button mat-icon-button matSuffix type="button" tabindex="-1" (click)="verClave3.type = verClave3.type === 'password' ? 'text' : 'password'" [matTooltip]="verClave3.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'"><mat-icon>{{ verClave3.type === 'password' ? 'visibility' : 'visibility_off' }}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls.confirmPassword.touched && changePasswordForm.controls.confirmPassword.invalid">
                    <span *ngIf="changePasswordForm.controls.confirmPassword.error.required">Este campo es
                        obligatorio</span>
                </mat-error>

                <mat-hint *ngIf="validateSubmit() && !(changePasswordForm.controls.confirmPassword.invalid)">
                    <span>La nueva contraseña y la confirmación de la contraseña no coinciden.</span>
                </mat-hint>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button color="primary" type="submit" (click)="handleChangePasswordSubmit()"
        [disabled]="validateSubmit() || !(changePasswordForm.valid && changePasswordForm.dirty)">Update</button>
    <button mat-raised-button color="primary" mat-dialog-close>Close</button>
</mat-dialog-actions>
