<app-encabezado titulo="Gestión campeonatos" icono="emoji_events">
    <button mat-stroked-button color="primary" (click)="reportePDF()"><mat-icon>picture_as_pdf</mat-icon> Reporte PDF</button>
    <button mat-flat-button color="primary" *ngIf="role === 'admin'" (click)="handleAddAction()"><mat-icon>add</mat-icon> Crear campeonato</button>
</app-encabezado>

<mat-card class="barra-filtros">
    <mat-form-field appearance="outline" class="filtro-buscar" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Buscar campeonato o gestión</mat-label>
        <input matInput (keyup)="applyFilter($event)" autocomplete="off">
    </mat-form-field>
</mat-card>

<div class="tabla-contenedor">
    <table mat-table matSort [dataSource]="dataSource" [paginador]="paginador">
            <ng-container matColumnDef="nombre_campeonato">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Campeonato</th>
                <td mat-cell *matCellDef="let element"> {{element.nombre_campeonato}} </td>
            </ng-container>

            <ng-container matColumnDef="gestion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Gestión</th>
                <td mat-cell *matCellDef="let element"> {{element.gestion}} </td>
            </ng-container>

            <ng-container matColumnDef="fecha_inicio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="fecha_i"> Fecha inicio</th>
                <td mat-cell *matCellDef="let element"> {{element.fecha_i}} </td>
            </ng-container>

            <ng-container matColumnDef="fecha_fin">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="fecha_f"> Fecha fin</th>
                <td mat-cell *matCellDef="let element"> {{element.fecha_f}} </td>
            </ng-container>


            <ng-container matColumnDef="convocatoria">
                <th mat-header-cell *matHeaderCellDef> Convocatoria</th>
                <td mat-cell *matCellDef="let element">
                    <div *ngIf="(element.convocatoria!='')">
                        <a [href]="imgURL + element.convocatoria" target="_blank">
                            <img width="30px" height="30px" src="../../../assets/img/pdf-icono.png" alt="no exist">
                        </a>
                    </div>
                </td>
            </ng-container>

            <ng-container *ngIf="role !== 'user'"  matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let element" class="action-link">
                    <button mat-icon-button color="primary" matTooltip="Modificar" (click)="handleEditAction(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="handleDeleteAction(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                    <mat-slide-toggle (change)="onChange($event.checked, element.id)"
                        matTooltip="Activar o desactivar campeonato" [checked]="element.status">

                    </mat-slide-toggle>
                </td>
            </ng-container>

            <ng-container matColumnDef="ver">
                <th mat-header-cell *matHeaderCellDef> Administrar</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-flat-button color="primary" (click)="handleAction(element)"><mat-icon>visibility</mat-icon> Ver</button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
            <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-no-data-row" *matNoDataRow><td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">No hay registros para mostrar.</td></tr>
        </table>
    <mat-paginator #paginador [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="25" showFirstLastButtons aria-label="Páginas"></mat-paginator>
</div>
