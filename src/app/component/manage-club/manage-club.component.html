<app-encabezado titulo="Gestión clubs" icono="shield">
    <button mat-stroked-button color="primary" (click)="reportePDF()"><mat-icon>picture_as_pdf</mat-icon> Reporte PDF</button>
    <button mat-flat-button color="primary" (click)="handleAddAction()"><mat-icon>add</mat-icon> Registrar club</button>
</app-encabezado>

<mat-card class="barra-filtros">
    <mat-form-field appearance="outline" class="filtro-buscar" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Buscar club o comunidad</mat-label>
        <input matInput (keyup)="applyFilter($event)" autocomplete="off">
    </mat-form-field>
</mat-card>

<div class="tabla-contenedor">
    <table mat-table matSort [dataSource]="dataSource">

        <ng-container matColumnDef="numero">
            <th mat-header-cell *matHeaderCellDef> No.</th>
            <td mat-cell *matCellDef="let element; index as i "> {{i+1}} </td>
        </ng-container>

        <ng-container matColumnDef="logo">
            <th mat-header-cell *matHeaderCellDef> Logo</th>
            <td mat-cell *matCellDef="let element">
                <span class="foto-lista" (click)="handleEditAction(element)" matTooltip="Cambiar logo">
                    <img *ngIf="element.logo; else sinLogo" [src]="imgURL + element.logo" alt="">
                    <ng-template #sinLogo><span class="foto-marcador"><mat-icon>shield</mat-icon></span></ng-template>
                    <span class="foto-lista-cambiar"><mat-icon>photo_camera</mat-icon></span>
                </span>
            </td>
        </ng-container>

        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre</th>
            <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="comunidad">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Comunidad</th>
            <td mat-cell *matCellDef="let element"> {{element.comunidad}} </td>
        </ng-container>

        <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let element" class="action-link">
                <button mat-icon-button color="primary" matTooltip="Editar" (click)="handleEditAction(element)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="handleDeleteAction(element)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
        <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-no-data-row" *matNoDataRow><td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">No hay registros para mostrar.</td></tr>
    </table>
</div>
