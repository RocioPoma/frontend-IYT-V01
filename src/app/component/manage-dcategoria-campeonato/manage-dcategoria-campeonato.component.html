<app-encabezado titulo="Categorías del campeonato" [subtitulo]="(arraycamp.nombre_campeonato || '') + (arraycamp.gestion ? ' · Gestión ' + arraycamp.gestion : '')" icono="category">
    <button mat-flat-button color="primary" *ngIf="role !== 'user'" (click)="handleAddAction()"><mat-icon>add</mat-icon> Agregar categoría al campeonato</button>
</app-encabezado>
<p class="vacio" *ngIf="!dataSource?.length">Este campeonato todavía no tiene categorías.</p>
<div class="grilla-categorias">
    <mat-card *ngFor="let element of dataSource" class="categoria" [class.inactiva]="element.estado === 'false' || element.estado === false">
        <img class="categoria-img" [src]="imagen(element.nombre_disciplina)" alt=""
            onerror="this.onerror=null; this.src='assets/img/deportes/DEPORTE GENERICO.jpg';">
        <div class="categoria-cuerpo">
            <h3>{{element.nombre_disciplina}} {{element.nombre_categoria}}</h3>
            <p>
                {{ element.genero === 'Masculino' ? 'Varones' : element.genero === 'Femenino' ? 'Damas' : 'Mixto' }}
                <span *ngIf="element.sistema_de_juego"> · {{element.sistema_de_juego}}</span>
            </p>
            <div class="categoria-acciones">
                <button mat-flat-button color="primary" (click)="handleDetalleAction(element)"><mat-icon>visibility</mat-icon> Administrar</button>
                <span class="espaciador"></span>
                <ng-container *ngIf="role !== 'user'">
                    <button mat-icon-button color="primary" matTooltip="Editar" (click)="handleEditAction(element)"><mat-icon>edit</mat-icon></button>
                    <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="handleDeleteAction(element)"><mat-icon>delete</mat-icon></button>
                    <mat-slide-toggle (change)="element.estado = $event.checked ? 'true' : 'false'; onChange($event.checked, element.id)"
                        matTooltip="Activar o desactivar la categoría" [checked]="element.estado === 'true' || element.estado === true">
                    </mat-slide-toggle>
                </ng-container>
            </div>
        </div>
    </mat-card>
</div>
