<app-encabezado [titulo]="(dataSource?.nombre_disciplina || '') + ' ' + (dataSource?.nombre_categoria || '')" [subtitulo]="dataSource?.nombre_campeonato ? dataSource.nombre_campeonato + ' · ' + dataSource.genero : ''" icono="sports_soccer"></app-encabezado>

<mat-tab-group class="pestanas-categoria" mat-stretch-tabs="false" animationDuration="150ms" [(selectedIndex)]="pestana">
  <mat-tab label="Detalle">
    <mat-card class="responsive_table">
      <mat-list>
        <mat-list-item>
          En esta categoría podrán ser habilitados {{ dataSource?.num_max_jugadores }} jugadores como máximo;
          edad mínima: {{ dataSource?.edad_min }}, edad máxima: {{ dataSource?.edad_max }}.
        </mat-list-item>
        <mat-divider></mat-divider>
      </mat-list>
      <div align="center">
        <img class="img" [src]="imagen(dataSource?.nombre_disciplina)" alt="" onerror="this.onerror=null; this.src='assets/img/deportes/DEPORTE GENERICO.jpg';" />
      </div>
    </mat-card>
  </mat-tab>

  <mat-tab label="Equipos">
    <ng-template matTabContent>
      <app-manage-dequipo></app-manage-dequipo>
    </ng-template>
  </mat-tab>

  <mat-tab label="Fixture - Partidos">
    <ng-template matTabContent>
      <app-manage-dpartido></app-manage-dpartido>
    </ng-template>
  </mat-tab>

  <mat-tab label="Tabla de posiciones">
    <ng-template matTabContent>
      <mat-card class="responsive_table"><app-manage-tabla-posiciones [idContempla]="id_contempla"></app-manage-tabla-posiciones></mat-card>
    </ng-template>
  </mat-tab>

  <mat-tab label="Ranking de jugadores">
    <ng-template matTabContent>
      <mat-card class="responsive_table"><app-manage-ranking-jugadores [idContempla]="id_contempla"></app-manage-ranking-jugadores></mat-card>
    </ng-template>
  </mat-tab>

  <mat-tab label="Medallero">
    <ng-template matTabContent>
      <mat-card class="responsive_table"><app-medallero-categoria [idContempla]="id_contempla" [editable]="true"></app-medallero-categoria></mat-card>
    </ng-template>
  </mat-tab>
</mat-tab-group>
