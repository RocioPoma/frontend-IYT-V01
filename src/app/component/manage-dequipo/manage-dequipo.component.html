<hr>
<mat-card class="responsive_table">
    <div class="float-center">
        <b class="tamano_titulo"><span>EQUIPOS</span></b>
    </div>
</mat-card>

<mat-card>
    <mat-form-field appearance="fill" fxFlex>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input autocomplete="off">
    </mat-form-field>
    <div class="btn-add">
        <button mat-flat-button color="primary" class="float-right" *ngIf="puedeInscribir" (click)="handleAddAction()">Registrar Equipo</button>
    </div>
</mat-card>
<hr>

<div class="row">
    <div class="responsive_table">
        <div *ngFor="let element of dataSource">
            <div class="column">
                <mat-card class="card ">
                    <mat-card-title-group class="mayuscula">
                        <mat-card-title align="left">{{element.nombre_club}}</mat-card-title>
                        <mat-card-subtitle align="left">
                            <div>{{element.comunidad}}</div>
                            <div class="estado-equipo" [ngClass]="element.estado">
                                {{ element.estado === 'pendiente' ? 'Pendiente de aprobación' : element.estado === 'rechazado' ? 'Rechazado' : 'Aprobado' }}
                                · {{ element.total_jugadores || 0 }} jugadores
                            </div>
                            <ng-container *ngIf="puedeAprobar && element.estado !== 'aprobado'">
                                <button mat-icon-button color="primary" matTooltip="Aprobar inscripción" (click)="cambiarEstado(element, 'aprobado')">
                                    <mat-icon>check_circle</mat-icon>
                                </button>
                            </ng-container>
                            <ng-container *ngIf="puedeAprobar && element.estado === 'pendiente'">
                                <button mat-icon-button color="warn" matTooltip="Rechazar inscripción" (click)="cambiarEstado(element, 'rechazado')">
                                    <mat-icon>cancel</mat-icon>
                                </button>
                            </ng-container>

                            <button [disabled]="(element.id_club !== id_club) && (role === 'user')" mat-icon-button color="primary" matTooltip="Agregar jugadores"
                                (click)="handleAddJugador(element)">
                                <mat-icon>group_add</mat-icon>
                            </button>
                            <button [disabled]="(element.id_club !== id_club) && (role === 'user')" mat-icon-button color="primary" matTooltip="Editar"
                                (click)="handleEditAction(element)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button [disabled]="(element.id_club !== id_club) && (role === 'user')" mat-icon-button color="primary" matTooltip="Eliminar"
                                (click)="handleDeleteAction(element)">
                                <mat-icon>delete</mat-icon>
                            </button>

                        </mat-card-subtitle>
                        <img class="img" mat-card-sm-image *ngIf="element.logo" [src]="urlArchivos + element.logo" alt="" loading="lazy">
                        <mat-icon *ngIf="!element.logo" class="escudo-equipo">shield</mat-icon>
                    </mat-card-title-group>
                </mat-card>
            </div>
        </div>
    </div>
</div>
