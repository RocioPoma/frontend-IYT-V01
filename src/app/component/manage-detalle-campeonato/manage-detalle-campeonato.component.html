<mat-card class="detalle-camp">
  <div class="datos-camp">
    <div class="dato-camp"><mat-icon>event</mat-icon><div><span>Fecha de inicio</span><b>{{ arraycamp.fecha_i || '—' }}</b></div></div>
    <div class="dato-camp"><mat-icon>event_available</mat-icon><div><span>Fecha de finalización</span><b>{{ arraycamp.fecha_f || '—' }}</b></div></div>
    <div class="dato-camp"><mat-icon>description</mat-icon><div><span>Convocatoria</span>
      <a *ngIf="arraycamp.convocatoria; else sinConv" [href]="imgURL + arraycamp.convocatoria" target="_blank" rel="noopener">Ver convocatoria</a>
      <ng-template #sinConv><b>No publicada</b></ng-template></div></div>
  </div>
  <img class="logo-camp" src="assets/img/logo-iyt.png" alt="Integración Yaretanense">
</mat-card>
