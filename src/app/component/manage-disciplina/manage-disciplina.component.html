<app-encabezado titulo="Disciplinas" icono="sports_soccer" subtitulo="Active o desactive las disciplinas que se juegan en los campeonatos."></app-encabezado>

<div class="grilla-disciplinas">
    <mat-card *ngFor="let element of datosDisciplina" class="disciplina" [class.inactiva]="element.estado !== 'true' && element.estado !== true">
        <img class="disciplina-img" [src]="imagen(element.nombre)" [alt]="element.nombre"
            onerror="this.onerror=null; this.src='assets/img/deportes/DEPORTE GENERICO.jpg';">
        <div class="disciplina-cuerpo">
            <div>
                <h3>{{element.nombre}}</h3>
                <p>"Siempre puedes ser mejor"</p>
            </div>
            <mat-slide-toggle (change)="element.estado = $event.checked ? 'true' : 'false'; onChange($event.checked, element.id)"
                matTooltip="Activar o desactivar disciplina" [checked]="element.estado === 'true' || element.estado === true">
            </mat-slide-toggle>
        </div>
    </mat-card>
</div>
