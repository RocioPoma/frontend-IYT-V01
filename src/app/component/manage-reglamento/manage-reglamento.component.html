<app-encabezado titulo="Reglamento y normativa" icono="gavel">
    <button mat-flat-button color="primary" *ngIf="role === 'admin'" (click)="handleAddAction()"><mat-icon>add</mat-icon> Añadir norma</button>
</app-encabezado>

<mat-card class="barra-filtros">
    <mat-form-field appearance="outline" class="filtro-buscar" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Buscar norma</mat-label>
        <input matInput (keyup)="applyFilter($event)" autocomplete="off">
    </mat-form-field>
</mat-card>

<div class="tabla-contenedor">
        <table mat-table matSort [dataSource]="dataSource" [paginador]="paginador">
            <ng-container matColumnDef="nombre_reglamento">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="nombre"> Nombre Reglamento</th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="documento">
                <th mat-header-cell *matHeaderCellDef> Documento PDF</th>
                <td mat-cell *matCellDef="let element">
                    <div *ngIf="(element.documento!=null)">
                        <a [href]="imgURL + element.documento" target="_blank" matTooltip="Ver Documento">
                            <img width="30px" height="30px" src="../../../assets/img/pdf-icono.png" alt="no exist">
                        </a>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let element" class="action-link">
                    <button mat-icon-button color="primary" matTooltip="Editar" (click)="handleEditAction(element)"
                        [disabled]="role === 'user'">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="handleDeleteAction(element)"
                        [disabled]="role === 'user'">
                        <mat-icon>delete</mat-icon>
                    </button>

                    <mat-slide-toggle (change)="onChange($event.checked, element.id)"
                        matTooltip="Activar o Desactivar Norma" [checked]="element.estado"
                        [disabled]="role === 'user'">
                    </mat-slide-toggle>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
            <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
        <tr class="mat-mdc-no-data-row" *matNoDataRow><td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">No hay registros para mostrar.</td></tr>
        </table>
    <mat-paginator #paginador [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="25" showFirstLastButtons aria-label="Páginas"></mat-paginator>
    </div>
