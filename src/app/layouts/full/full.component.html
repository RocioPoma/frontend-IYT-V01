<div class="main-container">
    <mat-toolbar class="topbar">
        <button mat-icon-button (click)="snav.toggle()" aria-label="Mostrar u ocultar el menú">
            <mat-icon>menu</mat-icon>
        </button>
        <button mat-icon-button (click)="handleAction()" aria-label="Ir a campeonatos">
            <mat-icon>home</mat-icon>
        </button>
        <span class="topbar-marca">
            <img src="assets/img/logo-iyt.png" alt="" class="topbar-logo">
            <span class="topbar-nombre">Integración Yaretanense</span>
        </span>
        <span class="espaciador"></span>
        <span class="topbar-usuario">{{usuario}}</span>
        <app-header></app-header>
    </mat-toolbar>
    <mat-sidenav-container class="example-sidenav-container">
        <mat-sidenav #snav id="snav" class="dark-sidebar" [mode]="mobileQuery.matches ? 'side' : 'over'"
            [opened]="mobileQuery.matches" [disableClose]="mobileQuery.matches">
            <app-sidebar></app-sidebar>
        </mat-sidenav>
        <mat-sidenav-content class="page-wrapper">
            <main class="page-content">
                <router-outlet></router-outlet>
            </main>
            <app-pie></app-pie>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
